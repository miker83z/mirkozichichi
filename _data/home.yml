    year: "2024–now"
    title: "VM & Language team"
    venue: "IOTA Foundation, R&D Department"
    description: "This team is currently focused on all aspects related to the Move smart contract language. We maintain the Rust-based source code responsible for the compilation and execution of Move code, as well as the integration of these components into the IOTA DLT protocol. Additionally, we collaborate with other teams to develop Move smart contracts for implementing core DLT functionalities and building decentralized applications on top of the blockchain. Looking ahead, we aim to explore the expansion of Move language features and potentially work with new smart contract languages."
