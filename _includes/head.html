<head>
  <link href="https://gmpg.org/xfn/11" rel="profile" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    {% if page.title == "Home" %}
      {{ site.title }}{% if site.tagline %} &middot; {{ site.tagline }}{% endif %}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- Description, canonical URL, link previews and structured data (jekyll-seo-tag) -->
  {% seo title=false %}
  <meta name="theme-color" content="#202020" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)" />

  <!-- The page follows the system light/dark setting; a choice made with the toggle
       (assets/js/theme-toggle.js) lasts for the current visit and is applied before the page is drawn -->
  <script>
    try {
      localStorage.removeItem('theme'); // older version of the toggle kept the choice forever
      var visitTheme = sessionStorage.getItem('theme');
      if (visitTheme === 'light' || visitTheme === 'dark') document.documentElement.setAttribute('data-theme', visitTheme);
    } catch (e) {}
  </script>

  {% include google-analytics.html %}

  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
  {% include font-includes.html %}

  <!-- Icons -->
  {% include favicons.html %}

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ site.feed.path | default: 'feed.xml' | relative_url }}" />

  {% include custom-head.html %}
</head>
